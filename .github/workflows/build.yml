name: Build and Release (APK & Windows)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows App
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Build Windows (Release)
        working-directory: frontend
        run: flutter build windows --release

      - name: Package Windows files
        shell: pwsh
        run: |
          $releaseDir = Get-ChildItem -Path "frontend/build/windows" -Recurse -Directory -Filter "Release" | Select-Object -First 1
          if ($releaseDir) {
            Write-Host "Found release directory at $($releaseDir.FullName)"
            Compress-Archive -Path "$($releaseDir.FullName)/*" -DestinationPath "parc-it-windows.zip"
          } else {
            throw "Release directory not found"
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: parc-it-windows
          path: parc-it-windows.zip

      - name: Publish Windows to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.0"
          name: "Parc IT v1.0.0 (Windows & Android)"
          body: |
            ### 📦 Fichiers d'installation Parc IT :
            * 💻 **Windows** : Téléchargez `parc-it-windows.zip`, décompressez l'archive et lancez `gestionnaire_parc_it.exe`.
            * 📱 **Android** : Téléchargez `parc-it.apk` pour installer l'application sur votre smartphone ou tablette.
            * 🌐 **Web** : Accessible en ligne sur [https://parc-it.vercel.app](https://parc-it.vercel.app).
          files: parc-it-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Build APK (Release)
        working-directory: frontend
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Prepare APK file
        run: |
          cp frontend/build/app/outputs/flutter-apk/app-release.apk parc-it.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: parc-it-android-apk
          path: parc-it.apk

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.0"
          name: "Parc IT v1.0.0 (Windows & Android)"
          body: |
            ### 📦 Fichiers d'installation Parc IT :
            * 💻 **Windows** : Téléchargez `parc-it-windows.zip`, décompressez l'archive et lancez `gestionnaire_parc_it.exe`.
            * 📱 **Android** : Téléchargez `parc-it.apk` pour installer l'application sur votre smartphone ou tablette.
            * 🌐 **Web** : Accessible en ligne sur [https://parc-it.vercel.app](https://parc-it.vercel.app).
          files: parc-it.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
